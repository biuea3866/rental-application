services:
  mysql:
    image: mysql:8.0
    container_name: rental-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: rental_commerce
      TZ: Asia/Seoul
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: rental-redis
    ports:
      - "6379:6379"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: rental-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: rental-kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"

  mongodb:
    image: mongo:7
    container_name: rental-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  minio:
    image: minio/minio:latest
    container_name: rental-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:latest
    container_name: rental-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set rental http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing rental/products;
      mc mb --ignore-existing rental/inspections;
      mc mb --ignore-existing rental/documents;
      mc mb --ignore-existing rental/chat;
      echo 'Buckets created';
      "

  pinpoint-hbase:
    image: pinpointdocker/pinpoint-hbase:3.0.0
    container_name: rental-pinpoint-hbase
    ports:
      - "16010:16010"
      - "16030:16030"
    volumes:
      - hbase-data:/home/pinpoint/hbase

  pinpoint-collector:
    image: pinpointdocker/pinpoint-collector:3.0.0
    container_name: rental-pinpoint-collector
    depends_on:
      - pinpoint-hbase
    environment:
      CLUSTER_ENABLE: "false"
      HBASE_HOST: pinpoint-hbase
      HBASE_PORT: 2181
    ports:
      - "9991:9991"
      - "9992:9992"
      - "9993:9993"
      - "9994:9994/udp"
      - "9995:9995/udp"
      - "9996:9996/udp"

  pinpoint-web:
    image: pinpointdocker/pinpoint-web:3.0.0
    container_name: rental-pinpoint-web
    depends_on:
      - pinpoint-hbase
    environment:
      CLUSTER_ENABLE: "false"
      HBASE_HOST: pinpoint-hbase
      HBASE_PORT: 2181
    ports:
      - "28080:8080"

volumes:
  mysql-data:
  mongo-data:
  minio-data:
  hbase-data:
