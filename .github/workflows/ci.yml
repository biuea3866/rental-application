# =============================================================================
# CI Pipeline - rental-commerce
# =============================================================================
# 테스트 실패 시 PR 머지를 차단하는 것이 핵심 목적입니다.
#
# [Branch Protection 설정 필요]
# GitHub > Settings > Branches > Branch protection rules 에서
# dev, main 브랜치에 대해 아래 status check를 required로 설정해야 합니다:
#   - be-test
#   - be-build
#   - fe-build
# "Require status checks to pass before merging" 옵션을 활성화하세요.
# =============================================================================

name: CI

on:
  pull_request:
    branches:
      - dev
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ===========================================================================
  # BE: 테스트 (Testcontainers 사용)
  # ===========================================================================
  be-test:
    name: BE Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Setup JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9  # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d  # v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/dev' }}

      - name: Compile Kotlin
        run: ./gradlew compileKotlin compileTestKotlin

      - name: Run Tests
        run: ./gradlew test

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 7

  # ===========================================================================
  # BE: 빌드 검증 (테스트 통과 후)
  # ===========================================================================
  be-build:
    name: BE Build
    runs-on: ubuntu-latest
    needs: be-test
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Setup JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9  # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d  # v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/dev' }}

      - name: Build bootJar
        run: ./gradlew :rental-api:bootJar

      - name: Verify JAR exists
        run: |
          JAR_FILE=$(ls rental-api/build/libs/rental-api-*.jar 2>/dev/null | head -1)
          if [ -z "$JAR_FILE" ]; then
            echo "::error::JAR file not found in rental-api/build/libs/"
            exit 1
          fi
          echo "JAR built successfully: $JAR_FILE"
          ls -lh "$JAR_FILE"

  # ===========================================================================
  # FE: 빌드 검증 (BE와 병렬 실행)
  # ===========================================================================
  fe-build:
    name: FE Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Setup Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: rental-web/package-lock.json

      - name: Install dependencies
        working-directory: rental-web
        run: npm ci

      - name: Lint
        working-directory: rental-web
        run: npm run lint

      - name: Test
        working-directory: rental-web
        run: npm run test

      - name: Build
        working-directory: rental-web
        run: npm run build
