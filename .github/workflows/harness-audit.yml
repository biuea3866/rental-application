# =============================================================================
# Harness Audit — Nightly + Manual
# =============================================================================
# harness-rules.json 기준 전수 감사를 매일 자동 실행.
# 위반 발견 시 Issue 를 자동 생성하거나 업데이트.
#
# 목적:
#  1. 훅이 막지 못한 사이 누적된 위반 조기 발견 (Sprint 4 회귀 방지)
#  2. 새 룰 추가 시 기존 코드의 위반 발견
#  3. false positive 추적
# =============================================================================

name: Harness Audit

on:
  schedule:
    # 매일 03:00 KST (= 18:00 UTC)
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      create_issue:
        description: "위반 발견 시 Issue 자동 생성 (true/false)"
        required: false
        default: 'true'

permissions:
  contents: read
  issues: write

jobs:
  audit:
    name: Harness Rule Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout dev
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          ref: dev

      - name: Setup Python
        uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d  # v5
        with:
          python-version: '3.11'

      - name: Validate harness-rules.json
        run: |
          python3 -c "import json; json.load(open('.claude/harness-rules.json'))"
          echo "JSON 유효성 확인 완료"

      - name: Run harness audit
        id: audit
        run: |
          python3 .claude/scripts/harness-audit.py > audit-report.txt 2>&1 || true
          cat audit-report.txt
          VIOLATIONS=$(grep -c "^\[.*ERROR\]\|^\[.*WARNING\]" audit-report.txt || echo 0)
          echo "violations=$VIOLATIONS" >> $GITHUB_OUTPUT

      - name: Upload audit report
        uses: actions/upload-artifact@0b7d5f5684d3f642f978d2faad9ade64f5b4dd57  # v4
        with:
          name: harness-audit-report
          path: audit-report.txt
          retention-days: 30

      - name: Create/update issue on violations
        if: steps.audit.outputs.violations != '0' && (github.event_name == 'schedule' || github.event.inputs.create_issue == 'true')
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea  # v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('audit-report.txt', 'utf8');
            const violations = '${{ steps.audit.outputs.violations }}';
            const date = new Date().toISOString().split('T')[0];
            const title = `[harness-audit] ${date} — ${violations}건 위반 감지`;

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'harness-audit',
              state: 'open',
            });

            const body = [
              `> Nightly harness audit 결과 (dev 기준)`,
              ``,
              `총 **${violations}건** 위반 발견.`,
              ``,
              '```',
              report.slice(0, 60000),
              '```',
              ``,
              `💡 훅 실제 적용 여부 점검:`,
              `- \`.claude/harness-rules.json\` JSON 유효성 확인`,
              `- Write/Edit 훅이 \`exit 2\`로 차단 중인지 샘플 검증`,
              ``,
              `🤖 Generated by harness-audit.yml`,
            ].join('\n');

            if (existing.data.length > 0) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                title,
                body,
              });
              console.log(`Updated issue #${existing.data[0].number}`);
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['harness-audit'],
              });
              console.log(`Created new issue`);
            }
