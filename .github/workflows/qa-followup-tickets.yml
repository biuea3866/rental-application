# =============================================================================
# QA Follow-up Tickets — QA 보고서 변경 감지 시 Issue 자동 생성
# =============================================================================
# docs/qa/*.md 에 "## 후속 티켓 제안" 또는 "| RC-BE-4xx | ..." 형식의 표가 추가되면
# 각 행을 GitHub Issue 로 자동 변환한다.
#
# 목적:
#  - pr-reviewer / harness-auditor 가 감지한 Minor/Major 지적을 문서에 적어두고
#    자동으로 티켓 발행 → 트래킹 누락 제거
# =============================================================================

name: QA Follow-up Tickets

on:
  push:
    branches: [dev]
    paths:
      - 'docs/qa/**.md'
  workflow_dispatch:
    inputs:
      report:
        description: "대상 QA 보고서 경로 (예: docs/qa/sprint4-qa-report-2026-04-23.md)"
        required: true

permissions:
  contents: read
  issues: write

jobs:
  extract-tickets:
    name: Extract & Create Follow-up Issues
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 2

      - name: Setup Python
        uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d  # v5
        with:
          python-version: '3.11'

      - name: Determine target report
        id: report
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "path=${{ github.event.inputs.report }}" >> $GITHUB_OUTPUT
          else
            # push 시: 변경된 qa .md 중 가장 최근 것
            CHANGED=$(git diff --name-only HEAD~1 HEAD -- 'docs/qa/**.md' | head -1)
            echo "path=$CHANGED" >> $GITHUB_OUTPUT
          fi

      - name: Extract tickets from report
        id: extract
        run: |
          python3 .claude/scripts/qa-followup-extract.py "${{ steps.report.outputs.path }}" > tickets.json
          COUNT=$(python3 -c "import json; print(len(json.load(open('tickets.json'))))")
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          cat tickets.json

      - name: Create issues
        if: steps.extract.outputs.count != '0'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea  # v7
        with:
          script: |
            const fs = require('fs');
            const tickets = JSON.parse(fs.readFileSync('tickets.json', 'utf8'));
            const report = '${{ steps.report.outputs.path }}';

            // 기존 열려 있는 issue 제목 모음
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'qa-followup',
              state: 'open',
              per_page: 100,
            });
            const existingTitles = new Set(existing.data.map(i => i.title));

            for (const t of tickets) {
              const title = `[${t.code}] ${t.summary}`;
              if (existingTitles.has(title)) {
                console.log(`skip (already open): ${title}`);
                continue;
              }
              const body = [
                `> QA 보고서에서 자동 발행된 후속 티켓.`,
                ``,
                `**근거**: ${t.source}`,
                `**보고서**: ${report}`,
                ``,
                `### 내용`,
                t.detail || '(상세 TBD)',
                ``,
                `### Acceptance Criteria`,
                `- [ ] QA 보고서 §후속 티켓 §${t.code} 항목 해소`,
                `- [ ] 관련 harness 룰/테스트 커버리지 추가`,
                ``,
                `🤖 Generated by qa-followup-tickets.yml`,
              ].join('\n');
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['qa-followup', t.code.split('-')[0].toLowerCase()],
              });
              console.log(`created: ${title}`);
            }
