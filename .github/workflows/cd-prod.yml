# =============================================================================
# CD Pipeline - Production Environment
# =============================================================================
# main 브랜치에 PR 머지 후 Docker 이미지를 빌드하여 GHCR에 푸시합니다.
# production 환경은 GitHub Environment의 required reviewers 승인이 필요합니다.
# =============================================================================

name: CD Prod

on:
  push:
    branches:
      - main

concurrency:
  group: cd-prod-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: none

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: biuea3866/rental-commerce

jobs:
  build-and-push:
    name: Build & Push Docker Image (Prod)
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4

      - name: Setup JDK 21
        uses: actions/setup-java@c5195efdbf56f615843bd9e21ef8816b7bd9f44a  # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ac638b010cf58a27ee6c972fe6e9dd5da61eaabe  # v4

      - name: Run Tests
        run: ./gradlew test

      - name: Build bootJar
        run: ./gradlew :rental-api:bootJar

      - name: Login to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772  # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2  # v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198a0c92b95c37  # v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:prod-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Production (placeholder)
        run: |
          echo "=========================================="
          echo " Deploy to Production Environment"
          echo "=========================================="
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:prod-${{ github.sha }}"
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          echo ""
          echo "TODO: 실제 배포 스크립트로 교체하세요."
          echo "  예시: kubectl set image deployment/rental-api ..."
          echo "  예시: ArgoCD sync / Helm upgrade"
          echo "=========================================="
