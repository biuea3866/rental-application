# =============================================================================
# CD Pipeline - Dev Environment
# =============================================================================
# dev 브랜치에 PR 머지 후 자동으로 Docker 이미지를 빌드하여 GHCR에 푸시합니다.
# kustomization.yml 갱신은 gitops 임시 브랜치 → PR → admin merge 방식.
# (dev branch protection의 required status checks 때문에 직접 커밋 불가)
# =============================================================================

name: CD Dev

on:
  push:
    branches:
      - dev

concurrency:
  group: cd-dev-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  pull-requests: write
  id-token: none

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: biuea3866/rental-commerce
  WEB_IMAGE_NAME: biuea3866/rental-web

jobs:
  build-and-push:
    name: Build & Push Docker Image (Dev)
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Setup JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9  # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d  # v4

      - name: Run Tests
        run: ./gradlew test

      - name: Build bootJar
        run: ./gradlew :rental-api:bootJar

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Build and Push BE Docker Image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-${{ github.sha }}
          cache-from: type=gha,scope=be
          cache-to: type=gha,mode=max,scope=be

      - name: Build and Push FE Docker Image (rental-web)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          file: deploy/k8s/Dockerfile.web
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.WEB_IMAGE_NAME }}:dev-${{ github.sha }}
          cache-from: type=gha,scope=fe
          cache-to: type=gha,mode=max,scope=fe

      # ArgoCD GitOps: gitops 임시 브랜치에 커밋 → dev로 PR 자동 생성 + admin merge
      # dev 직접 커밋은 required status checks (409) 때문에 불가
      - name: Update kustomization.yml via gitops PR
        run: |
          FILE_PATH="deploy/k8s/overlays/dev/kustomization.yml"
          REPO="${{ github.repository }}"
          NEW_TAG="dev-${{ github.sha }}"
          GITOPS_BRANCH="gitops/image-tag-${GITHUB_SHA::8}"

          echo "=== Step 1: gitops 브랜치 생성 (dev HEAD) ==="
          DEV_SHA=$(curl -sSf \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/git/ref/heads/dev" | jq -r '.object.sha')
          echo "dev SHA: $DEV_SHA"

          curl -sSf -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/git/refs" \
            -d "{\"ref\":\"refs/heads/${GITOPS_BRANCH}\",\"sha\":\"${DEV_SHA}\"}"
          echo "Branch created: $GITOPS_BRANCH"

          echo "=== Step 2: kustomization.yml 업데이트 (gitops 브랜치) ==="
          RESPONSE=$(curl -sSf \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/contents/${FILE_PATH}?ref=${GITOPS_BRANCH}")

          FILE_SHA=$(echo "$RESPONSE" | jq -r '.sha')
          CURRENT_CONTENT=$(echo "$RESPONSE" | jq -r '.content' | base64 -d)

          UPDATED_CONTENT=$(echo "$CURRENT_CONTENT" \
            | sed -E "/name: ghcr\.io\/biuea3866\/rental-commerce/{n;s/newTag: .*/newTag: ${NEW_TAG}/}" \
            | sed -E "/name: ghcr\.io\/biuea3866\/rental-web/{n;s/newTag: .*/newTag: ${NEW_TAG}/}")

          ENCODED=$(echo "$UPDATED_CONTENT" | base64 -w 0)

          curl -sSf -X PUT \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/contents/${FILE_PATH}" \
            -d "{
              \"message\": \"chore(gitops): dev 이미지 태그 갱신 — ${NEW_TAG}\",
              \"content\": \"${ENCODED}\",
              \"sha\": \"${FILE_SHA}\",
              \"branch\": \"${GITOPS_BRANCH}\"
            }"
          echo "File updated on $GITOPS_BRANCH"

          echo "=== Step 3: dev로 PR 생성 + admin merge ==="
          PR_NUMBER=$(curl -sSf -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/pulls" \
            -d "{
              \"title\": \"chore(gitops): dev 이미지 태그 — ${NEW_TAG}\",
              \"head\": \"${GITOPS_BRANCH}\",
              \"base\": \"dev\",
              \"body\": \"CD 자동 생성 PR — 이미지 태그 갱신. CI skip 대상.\"
            }" | jq -r '.number')
          echo "PR #${PR_NUMBER} created"

          # admin merge (required checks 우회)
          MERGE_RESULT=$(curl -s -o /tmp/merge_response.json -w "%{http_code}" -X PUT \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/pulls/${PR_NUMBER}/merge" \
            -d "{\"merge_method\":\"squash\"}")

          if [ "$MERGE_RESULT" = "200" ]; then
            echo "✅ PR #${PR_NUMBER} merged"
          else
            echo "⚠️ Merge HTTP $MERGE_RESULT — trying with admin flag"
            cat /tmp/merge_response.json
            # admin merge fallback — required checks 우회 불가 시 skip
            echo "WARN: 이미지 태그 갱신 PR이 자동 머지되지 않았습니다. 수동 머지 필요."
          fi

          echo "=== Step 4: gitops 브랜치 삭제 ==="
          curl -s -X DELETE \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/git/refs/heads/${GITOPS_BRANCH}" || true

          echo "✅ GitOps 완료 — ${NEW_TAG}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
