# =============================================================================
# CD Pipeline - Dev Environment
# =============================================================================
# dev 브랜치에 PR 머지 후 자동으로 Docker 이미지를 빌드하여 GHCR에 푸시합니다.
# =============================================================================

name: CD Dev

on:
  push:
    branches:
      - dev

concurrency:
  group: cd-dev-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  id-token: none

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: biuea3866/rental-commerce

jobs:
  build-and-push:
    name: Build & Push Docker Image (Dev)
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Setup JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9  # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d  # v4

      - name: Run Tests
        run: ./gradlew test

      - name: Build bootJar
        run: ./gradlew :rental-api:bootJar

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ArgoCD GitOps: gitops/dev 브랜치에 이미지 태그 직접 push
      # gitops/dev는 branch protection 없음 → PR 없이 바로 반영
      - name: Update Kustomize image tag on gitops/dev
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # gitops/dev 브랜치로 전환 (없으면 dev 기반으로 생성)
          git fetch origin gitops/dev:gitops/dev 2>/dev/null || git checkout -b gitops/dev
          git checkout gitops/dev
          # dev 브랜치의 k8s 파일 동기화 (베이스 매니페스트 최신화)
          git checkout origin/dev -- deploy/k8s/

          cd deploy/k8s/overlays/dev
          sed -i "s/newTag: .*/newTag: dev-${{ github.sha }}/" kustomization.yml

          git add deploy/k8s/
          git diff --staged --quiet && echo "No changes" && exit 0

          git commit -m "chore(gitops): dev 이미지 태그 갱신 — dev-${{ github.sha }}"
          git push origin gitops/dev
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
