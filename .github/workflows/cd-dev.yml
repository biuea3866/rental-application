# =============================================================================
# CD Pipeline - Dev Environment
# =============================================================================
# dev 브랜치에 PR 머지 후 자동으로 Docker 이미지를 빌드하여 GHCR에 푸시합니다.
# =============================================================================

name: CD Dev

on:
  push:
    branches:
      - dev

concurrency:
  group: cd-dev-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  id-token: none

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: biuea3866/rental-commerce
  WEB_IMAGE_NAME: biuea3866/rental-web

jobs:
  build-and-push:
    name: Build & Push Docker Image (Dev)
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Setup JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9  # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d  # v4

      - name: Run Tests
        run: ./gradlew test

      - name: Build bootJar
        run: ./gradlew :rental-api:bootJar

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Build and Push BE Docker Image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-${{ github.sha }}
          cache-from: type=gha,scope=be
          cache-to: type=gha,mode=max,scope=be

      - name: Build and Push FE Docker Image (rental-web)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          file: deploy/k8s/Dockerfile.web
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.WEB_IMAGE_NAME }}:dev-${{ github.sha }}
          cache-from: type=gha,scope=fe
          cache-to: type=gha,mode=max,scope=fe

      # ArgoCD GitOps: GitHub Contents API로 dev 브랜치의 kustomization.yml 직접 업데이트
      # git clone/checkout 없이 단일 파일만 수정 → exit 128 문제 원천 제거
      # 409 Conflict 대응: SHA 충돌 시 최대 5회 retry (동시 CD 실행 보호)
      - name: Update kustomization.yml image tags via GitHub Contents API
        run: |
          FILE_PATH="deploy/k8s/overlays/dev/kustomization.yml"
          REPO="${{ github.repository }}"
          BRANCH="dev"
          NEW_TAG="dev-${{ github.sha }}"
          MAX_RETRIES=5

          for i in $(seq 1 $MAX_RETRIES); do
            echo "[Attempt $i/$MAX_RETRIES] Fetching current file..."

            RESPONSE=$(curl -sSf \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/contents/${FILE_PATH}?ref=${BRANCH}")

            FILE_SHA=$(echo "$RESPONSE" | jq -r '.sha')
            CURRENT_CONTENT=$(echo "$RESPONSE" | jq -r '.content' | base64 -d)

            UPDATED_CONTENT=$(echo "$CURRENT_CONTENT" \
              | sed -E "/name: ghcr\.io\/biuea3866\/rental-commerce/{n;s/newTag: .*/newTag: ${NEW_TAG}/}" \
              | sed -E "/name: ghcr\.io\/biuea3866\/rental-web/{n;s/newTag: .*/newTag: ${NEW_TAG}/}")

            ENCODED=$(echo "$UPDATED_CONTENT" | base64 -w 0)

            HTTP_CODE=$(curl -s -o /tmp/put_response.json -w "%{http_code}" -X PUT \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/contents/${FILE_PATH}" \
              -d "{
                \"message\": \"chore(gitops): dev 이미지 태그 갱신 — ${NEW_TAG}\",
                \"content\": \"${ENCODED}\",
                \"sha\": \"${FILE_SHA}\",
                \"branch\": \"${BRANCH}\"
              }")

            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ]; then
              echo "✅ Success (HTTP $HTTP_CODE)"
              exit 0
            elif [ "$HTTP_CODE" = "409" ]; then
              echo "⚠️ 409 response body:"
              cat /tmp/put_response.json 2>/dev/null || true
              echo ""
              echo "FILE_SHA=$FILE_SHA"
              echo "Retrying in 3s..."
              sleep 3
            else
              echo "❌ Unexpected HTTP $HTTP_CODE"
              cat /tmp/put_response.json
              exit 1
            fi
          done

          echo "❌ Failed after $MAX_RETRIES retries"
          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
