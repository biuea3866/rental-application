# =============================================================================
# CD Pipeline - Dev Environment
# =============================================================================
# dev 브랜치에 PR 머지 후 자동으로 Docker 이미지를 빌드하여 GHCR에 푸시합니다.
# =============================================================================

name: CD Dev

on:
  push:
    branches:
      - dev

concurrency:
  group: cd-dev-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  id-token: none

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: biuea3866/rental-commerce

jobs:
  build-and-push:
    name: Build & Push Docker Image (Dev)
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4

      - name: Setup JDK 21
        uses: actions/setup-java@c5195efdbf56f615843bd9e21ef8816b7bd9f44a  # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ac638b010cf58a27ee6c972fe6e9dd5da61eaabe  # v4

      - name: Run Tests
        run: ./gradlew test

      - name: Build bootJar
        run: ./gradlew :rental-api:bootJar

      - name: Login to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772  # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2  # v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198a0c92b95c37  # v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ArgoCD GitOps: Kustomize overlay의 이미지 태그를 갱신하여 커밋
      # ArgoCD가 이 변경을 감지하고 자동으로 dev 클러스터에 배포 (automated sync)
      - name: Update Kustomize image tag
        run: |
          cd deploy/k8s/overlays/dev
          # kustomize edit으로 이미지 태그 갱신
          cat kustomization.yml | sed "s/newTag: .*/newTag: dev-${{ github.sha }}/" > kustomization.tmp.yml
          mv kustomization.tmp.yml kustomization.yml

      - name: Commit and push image tag update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deploy/k8s/overlays/dev/kustomization.yml
          git diff --staged --quiet || git commit -m "chore(cd): dev 이미지 태그 갱신 — dev-${{ github.sha }}"
          git push
