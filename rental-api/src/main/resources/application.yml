spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/rental_commerce?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul}
    username: ${SPRING_DATASOURCE_USERNAME:rental}
    password: ${SPRING_DATASOURCE_PASSWORD:rental}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
    show-sql: false
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/rental_commerce}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:local-dev-secret-key-must-be-at-least-256-bits-long}
  expiration: ${JWT_EXPIRATION:86400000}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  buckets:
    default: ${MINIO_BUCKET:rental-commerce}
    product-images: ${MINIO_BUCKET_PRODUCT_IMAGES:rental-commerce}

social:
  kakao:
    client-id: ${KAKAO_CLIENT_ID:dev-placeholder}
    client-secret: ${KAKAO_CLIENT_SECRET:dev-placeholder}
    redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:3000/auth/kakao/callback}
  naver:
    client-id: ${NAVER_CLIENT_ID:dev-placeholder}
    client-secret: ${NAVER_CLIENT_SECRET:dev-placeholder}
    redirect-uri: ${NAVER_REDIRECT_URI:http://localhost:3000/auth/naver/callback}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
    prometheus:
      enabled: true
  metrics:
    tags:
      application: rental-api
      environment: ${SPRING_PROFILES_ACTIVE:local}
    export:
      prometheus:
        enabled: true
