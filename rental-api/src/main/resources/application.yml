spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/rental_commerce?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul}
    username: ${SPRING_DATASOURCE_USERNAME:rental}
    password: ${SPRING_DATASOURCE_PASSWORD:rental}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
    mongodb:
      auto-index-creation: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

server:
  port: ${SERVER_PORT:8080}

jwt:
  access-token-expiry: PT30M
  refresh-token-expiry: P14D
  issuer: rental-commerce

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  buckets:
    products: products
    inspections: inspections
    documents: documents
    chat: chat

social:
  kakao:
    client-id: ${KAKAO_CLIENT_ID:local-kakao-client-id}
    client-secret: ${KAKAO_CLIENT_SECRET:local-kakao-client-secret}
    redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:3000/login/social/callback?provider=KAKAO}
  naver:
    client-id: ${NAVER_CLIENT_ID:local-naver-client-id}
    client-secret: ${NAVER_CLIENT_SECRET:local-naver-client-secret}
    redirect-uri: ${NAVER_REDIRECT_URI:http://localhost:3000/login/social/callback?provider=NAVER}
