spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/rental_commerce?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul}
    username: ${SPRING_DATASOURCE_USERNAME:rental}
    password: ${SPRING_DATASOURCE_PASSWORD:rental}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
    show-sql: false
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/rental_commerce}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.rental.commerce.domain.rental.event"
      rental-status:
        group-id: ${KAFKA_CONSUMER_RENTAL_STATUS_GROUP_ID:rental-status-notification}

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:local-dev-secret-key-must-be-at-least-256-bits-long}
  expiration: ${JWT_EXPIRATION:86400000}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  # CRT-001 / MAJ-001: 실제 MinIO 버킷명과 일치하도록 수정
  buckets:
    default: ${MINIO_BUCKET_DEFAULT:products}
    product-images: ${MINIO_BUCKET_PRODUCT_IMAGES:products}
    inspections: ${MINIO_BUCKET_INSPECTIONS:inspections}
    documents: ${MINIO_BUCKET_DOCUMENTS:documents}
    chat: ${MINIO_BUCKET_CHAT:chat}

social:
  kakao:
    client-id: ${KAKAO_CLIENT_ID:dev-placeholder}
    client-secret: ${KAKAO_CLIENT_SECRET:dev-placeholder}
    redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:3000/auth/kakao/callback}
  naver:
    client-id: ${NAVER_CLIENT_ID:dev-placeholder}
    client-secret: ${NAVER_CLIENT_SECRET:dev-placeholder}
    redirect-uri: ${NAVER_REDIRECT_URI:http://localhost:3000/auth/naver/callback}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
    prometheus:
      enabled: true
  metrics:
    tags:
      application: rental-api
      environment: ${SPRING_PROFILES_ACTIVE:local}
    export:
      prometheus:
        enabled: true
