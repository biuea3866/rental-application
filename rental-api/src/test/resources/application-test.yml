spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
    mongodb:
      auto-index-creation: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

jwt:
  access-token-expiry: PT30M
  refresh-token-expiry: P14D
  issuer: rental-commerce-test

minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  buckets:
    products: products
    inspections: inspections
    documents: documents
    chat: chat

social:
  kakao:
    client-id: ${KAKAO_CLIENT_ID:test-kakao-client-id}
    client-secret: ${KAKAO_CLIENT_SECRET:test-kakao-client-secret}
    redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:3000/auth/kakao/callback}
  naver:
    client-id: ${NAVER_CLIENT_ID:test-naver-client-id}
    client-secret: ${NAVER_CLIENT_SECRET:test-naver-client-secret}
    redirect-uri: ${NAVER_REDIRECT_URI:http://localhost:3000/auth/naver/callback}
