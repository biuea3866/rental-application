# =============================================================================
# Rental Commerce - CI/Test Environment (경량 구성)
# =============================================================================
# CI 파이프라인 또는 Testcontainers와 함께 사용하는 최소 인프라 구성.
# 앱 서비스 없이 의존 인프라만 기동합니다.
#
# 사용법:
#   docker compose -f docker-compose.test.yml up -d
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # MySQL 8.0: 테스트 DB (tmpfs로 빠른 I/O)
  # ---------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: rental-test-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: rental_commerce_test
      MYSQL_USER: rental
      MYSQL_PASSWORD: rental
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    tmpfs:
      - /var/lib/mysql
    networks:
      - rental-test-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Redis 7: 테스트용 캐시
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: rental-test-redis
    ports:
      - "6379:6379"
    networks:
      - rental-test-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

networks:
  rental-test-network:
    driver: bridge
