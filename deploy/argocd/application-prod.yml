# =============================================================================
# ArgoCD Application: rental-commerce (Production)
# =============================================================================
# main 브랜치의 Kustomize overlay를 감시합니다.
# prod는 자동 동기화를 비활성화하여 수동 승인 후 배포합니다.
#
# 배포 절차:
#   1. CD 파이프라인이 이미지 태그를 overlays/prod/kustomization.yml에 커밋
#   2. ArgoCD UI/CLI에서 diff 확인
#   3. argocd app sync rental-commerce-prod (수동 승인)
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rental-commerce-prod
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: rental-commerce
    environment: production
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/biuea3866/rental-application.git
    targetRevision: main
    path: deploy/k8s/overlays/prod

  destination:
    server: https://kubernetes.default.svc
    namespace: rental-commerce

  syncPolicy:
    # prod는 자동 동기화 비활성화 — 수동 승인 후 배포
    # automated: (의도적으로 생략)
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
      - Validate=true

    retry:
      limit: 3
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 3m

  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
