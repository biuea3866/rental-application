# =============================================================================
# ArgoCD Application: rental-commerce (Dev)
# =============================================================================
# dev 브랜치의 Kustomize overlay를 감시하여 자동 배포합니다.
#
# 설치:
#   kubectl apply -f deploy/argocd/application-dev.yml
#
# ArgoCD가 설치된 네임스페이스(기본 argocd)에 적용하세요.
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rental-commerce-dev
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: rental-commerce
    environment: dev
  # 앱 삭제 시 리소스도 함께 정리
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    # GitOps 소스 — gitops/dev 브랜치의 Kustomize overlay 경로
    # CD 파이프라인이 이미지 태그를 직접 push하는 전용 브랜치 (branch protection 없음)
    repoURL: https://github.com/biuea3866/rental-application.git
    targetRevision: gitops/dev
    path: deploy/k8s/overlays/dev

  destination:
    # 배포 대상 클러스터 + 네임스페이스
    server: https://kubernetes.default.svc
    namespace: rental-commerce-dev

  syncPolicy:
    # 자동 동기화 — dev 브랜치에 push되면 자동 배포
    automated:
      prune: true       # Git에서 삭제된 리소스는 클러스터에서도 삭제
      selfHeal: true     # 수동 변경 감지 시 Git 상태로 복원
      allowEmpty: false

    # 동기화 옵션
    syncOptions:
      - CreateNamespace=true          # 네임스페이스 자동 생성
      - PrunePropagationPolicy=foreground
      - PruneLast=true                # 삭제는 마지막에 수행
      - ApplyOutOfSyncOnly=true       # 변경된 리소스만 적용 (성능)
      - ServerSideApply=true          # SSA 사용 (대규모 매니페스트 호환)

    # 자동 재시도 (일시적 오류 대응)
    retry:
      limit: 3
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 3m

  # Diff 무시 패턴 (HPA가 replicas를 조정하면 drift로 감지하지 않음)
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
