# =============================================================================
# Kustomize Base: rental-commerce
# =============================================================================
# 모든 K8s 리소스를 하나로 묶어 배포합니다.
#
# 사용법:
#   kubectl apply -k deploy/k8s/           # 전체 적용
#   kubectl kustomize deploy/k8s/          # 미리보기 (dry-run)
#   kubectl delete -k deploy/k8s/          # 전체 삭제
#
# 환경별 오버레이:
#   kubectl apply -k deploy/k8s/overlays/dev/   # dev 환경
#   kubectl apply -k deploy/k8s/overlays/prod/  # prod 환경
# ArgoCD는 overlay 경로를 직접 참조합니다.
# =============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: rental-commerce

commonLabels:
  app.kubernetes.io/managed-by: kustomize

resources:
  - namespace.yml
  - configmap.yml
  - secret.yml
  - deployment.yml
  - service.yml
  - ingress.yml
  - hpa.yml
