# =============================================================================
# Kustomize Base: rental-commerce
# =============================================================================
# 모든 K8s 리소스를 하나로 묶어 배포합니다.
#
# 사용법:
#   kubectl apply -k deploy/k8s/           # 전체 적용
#   kubectl kustomize deploy/k8s/          # 미리보기 (dry-run)
#   kubectl delete -k deploy/k8s/          # 전체 삭제
#
# 환경별 오버레이가 필요하면 deploy/k8s/overlays/{dev,staging,prod}/를
# 추가하여 kustomize overlay 패턴을 적용합니다.
# =============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: rental-commerce

commonLabels:
  app.kubernetes.io/managed-by: kustomize

resources:
  - namespace.yml
  - configmap.yml
  - secret.yml
  - deployment.yml
  - service.yml
  - ingress.yml
  - hpa.yml
