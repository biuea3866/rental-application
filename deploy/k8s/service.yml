# =============================================================================
# Service: rental-api
# =============================================================================
# ClusterIP 서비스로 클러스터 내부에서 rental-api 파드에 접근합니다.
# 외부 노출은 Ingress를 통해 처리됩니다.
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: rental-api
  namespace: rental-commerce
  labels:
    app.kubernetes.io/name: rental-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: rental-commerce
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: rental-api
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
