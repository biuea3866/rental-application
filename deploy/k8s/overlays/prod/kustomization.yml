# =============================================================================
# Kustomize Overlay: Production Environment
# =============================================================================
# ArgoCD가 이 경로를 참조하여 prod 환경에 배포합니다.
#   argocd app sync rental-commerce-prod
# =============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: rental-commerce

resources:
  - ../../base  # base 참조 (kustomize v5 compatible)

# prod 환경 이미지 태그 — CD 파이프라인이 kustomize edit set image로 갱신
images:
  - name: ghcr.io/biuea3866/rental-commerce
    newTag: latest

# prod 환경 레플리카 + 리소스 스케일업 + ConfigMap 오버라이드
patches:
  - target:
      kind: Deployment
      name: rental-api
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "512Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "500m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "1Gi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "1000m"
  - target:
      kind: HorizontalPodAutoscaler
      name: rental-api
    patch: |
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 10
  - target:
      kind: ConfigMap
      name: rental-api-config
    patch: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: rental-api-config
      data:
        SPRING_PROFILES_ACTIVE: "prod"
        LOG_LEVEL: "WARN"

# prod 환경 라벨
commonLabels:
  app.kubernetes.io/instance: rental-commerce-prod
  environment: production
