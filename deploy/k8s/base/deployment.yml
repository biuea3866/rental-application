# =============================================================================
# Deployment: rental-api
# =============================================================================
# rental-commerce API 서버 배포 매니페스트.
# - 레플리카 2개로 고가용성 확보
# - 리소스 제한으로 안정적인 클러스터 운영
# - Non-root 사용자로 보안 강화
# - Liveness/Readiness 프로브로 자동 복구
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rental-api
  namespace: rental-commerce
  labels:
    app.kubernetes.io/name: rental-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: rental-commerce
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: rental-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rental-api
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: rental-commerce
    spec:
      # Non-root 보안 컨텍스트
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

      containers:
        - name: rental-api
          image: ghcr.io/biuea3866/rental-commerce:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          # ConfigMap 환경변수
          envFrom:
            - configMapRef:
                name: rental-api-config

          # Secret 환경변수 (민감 정보: DB 자격증명, JWT, MinIO 키)
          # SPRING_DATASOURCE_URL, SPRING_DATA_REDIS_HOST, SPRING_KAFKA_BOOTSTRAP_SERVERS, MINIO_ENDPOINT 는 ConfigMap에서 주입
          env:
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: rental-api-secret
                  key: DB_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rental-api-secret
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: rental-api-secret
                  key: JWT_SECRET
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rental-api-secret
                  key: MINIO_ACCESS_KEY
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: rental-api-secret
                  key: MINIO_SECRET_KEY

          # 리소스 제한
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"

          # Liveness 프로브: 컨테이너가 살아있는지 확인
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3

          # Readiness 프로브: 트래픽 수신 준비 확인
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

      # imagePullSecrets: 로컬 minikube에서는 불필요 (IfNotPresent + local docker build 사용)
