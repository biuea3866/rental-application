# =============================================================================
# Ingress: rental-api
# =============================================================================
# nginx Ingress Controller를 통한 외부 트래픽 라우팅.
# TLS와 호스트명은 실제 배포 환경에 맞게 수정해야 합니다.
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rental-api
  namespace: rental-commerce
  labels:
    app.kubernetes.io/name: rental-api
    app.kubernetes.io/component: ingress
    app.kubernetes.io/part-of: rental-commerce
  annotations:
    # nginx Ingress Controller 설정
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    # CORS 설정 (필요 시 활성화)
    # nginx.ingress.kubernetes.io/enable-cors: "true"
    # nginx.ingress.kubernetes.io/cors-allow-origin: "https://rental-commerce.local"
spec:
  # TLS 설정 (실제 인증서 Secret으로 교체 필요)
  tls:
    - hosts:
        - api.rental-commerce.local
      secretName: rental-api-tls
  rules:
    - host: api.rental-commerce.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rental-api
                port:
                  number: 80
