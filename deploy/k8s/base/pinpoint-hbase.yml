# =============================================================================
# Pinpoint HBase - Deployment + Service
# =============================================================================
# pinpoint-hbase:3.0.0 이미지는 zoo1:2181 외부 ZooKeeper를 전제로 설계됨.
# 별도 배포된 pinpoint-zookeeper(zoo1 서비스)를 사용하며,
# HBase 자체 embedded ZK는 사용하지 않는다.
# =============================================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pinpoint-hbase
  namespace: rental-commerce
  labels:
    app.kubernetes.io/name: pinpoint-hbase
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: rental-commerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pinpoint-hbase
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pinpoint-hbase
        app.kubernetes.io/component: monitoring
        app.kubernetes.io/part-of: rental-commerce
    spec:
      initContainers:
        - name: wait-zookeeper
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z zoo1 2181; do echo waiting for ZooKeeper zoo1; sleep 5; done']
      containers:
        - name: pinpoint-hbase
          image: pinpointdocker/pinpoint-hbase:3.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: hbase-master
              containerPort: 60000
              protocol: TCP
            - name: hbase-master-ui
              containerPort: 60010
              protocol: TCP
            - name: hbase-region
              containerPort: 60020
              protocol: TCP
            - name: hbase-region-ui
              containerPort: 60030
              protocol: TCP
          env:
            - name: ACCEPT_EULA
              value: "true"
            # HBase가 외부 ZooKeeper(zoo1:2181)를 사용하도록 설정
            - name: HBASE_CONF_hbase_zookeeper_quorum
              value: "zoo1"
            - name: HBASE_CONF_hbase_zookeeper_property_clientPort
              value: "2181"
          resources:
            requests:
              memory: "2Gi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
          readinessProbe:
            tcpSocket:
              port: 60000
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 40
---
apiVersion: v1
kind: Service
metadata:
  name: pinpoint-hbase
  namespace: rental-commerce
  labels:
    app.kubernetes.io/name: pinpoint-hbase
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: rental-commerce
spec:
  type: ClusterIP
  ports:
    - name: hbase-master
      port: 60000
      targetPort: 60000
      protocol: TCP
    - name: hbase-master-ui
      port: 60010
      targetPort: 60010
      protocol: TCP
    - name: hbase-region
      port: 60020
      targetPort: 60020
      protocol: TCP
    - name: hbase-region-ui
      port: 60030
      targetPort: 60030
      protocol: TCP
  selector:
    app.kubernetes.io/name: pinpoint-hbase
