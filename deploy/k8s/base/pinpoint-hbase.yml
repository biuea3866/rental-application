# =============================================================================
# Pinpoint HBase - Deployment + Service
# =============================================================================
# pinpoint-hbase:3.0.0 이미지는 zoo1:2181 외부 ZooKeeper를 전제로 설계됨.
# 별도 배포된 pinpoint-zookeeper(zoo1 서비스)를 사용하며,
# HBase 자체 embedded ZK는 사용하지 않는다.
# =============================================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pinpoint-hbase
  namespace: rental-commerce
  labels:
    app.kubernetes.io/name: pinpoint-hbase
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: rental-commerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pinpoint-hbase
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pinpoint-hbase
        app.kubernetes.io/component: monitoring
        app.kubernetes.io/part-of: rental-commerce
    spec:
      initContainers:
        - name: wait-zookeeper
          image: alpine:3.19
          command: ['sh', '-c', 'until nc -z -w3 zoo1 2181; do echo waiting for ZooKeeper zoo1; sleep 5; done']
        # Dev 환경에서만: HBase 시작 전 ZK /hbase 상태 완전 초기화 (ephemeral storage와 동기화)
        - name: wipe-zk-hbase
          image: zookeeper:3.8
          command: ['sh', '-c', 'echo "deleteall /hbase" | zkCli.sh -server zoo1:2181 2>&1 | tail -5; exit 0']
      containers:
        - name: pinpoint-hbase
          image: pinpointdocker/pinpoint-hbase:3.0.0
          imagePullPolicy: IfNotPresent
          # configure-hbase.sh은 TTL sed만 처리 → HBASE_CONF_ 계열 env var이 hbase-site.xml에 반영되지 않음.
          # 직접 sed로 3가지 핵심 프로퍼티 주입 후 기존 initialize-hbase.sh 실행:
          #   hbase.zookeeper.session.timeout=300000  — GC pause 대응 (기본 90s→300s)
          #   hbase.master.hostname=$POD_IP           — Pod IP로 ZK 등록 (Service ClusterIP bind 실패 회피)
          #   hbase.regionserver.hostname=$POD_IP     — Pod IP는 Pod 자체 인터페이스 + 클러스터 라우팅 가능
          command: ["/bin/sh", "-c"]
          args:
            - |
              CONF=$(find /opt /usr/local /home -name hbase-site.xml 2>/dev/null | head -1) &&
              echo "[init] patching hbase-site.xml at $CONF with POD_IP=$POD_IP" &&
              sed -i "s|</configuration>|<property><name>hbase.zookeeper.session.timeout</name><value>300000</value></property><property><name>hbase.master.hostname</name><value>${POD_IP}</value></property><property><name>hbase.regionserver.hostname</name><value>${POD_IP}</value></property></configuration>|" "$CONF" &&
              echo "[init] wiping stale HBase data dir (ephemeral storage, dev only)" &&
              rm -rf /home/pinpoint/hbase/* &&
              /usr/local/bin/initialize-hbase.sh &&
              HBASE_PID=$(pgrep -f "proc_master") &&
              echo "[init] HBase master PID=$HBASE_PID, waiting for it to exit" &&
              tail --pid=$HBASE_PID -f /dev/null
          ports:
            - name: hbase-master
              containerPort: 60000
              protocol: TCP
            - name: hbase-master-ui
              containerPort: 60010
              protocol: TCP
            - name: hbase-region
              containerPort: 60020
              protocol: TCP
            - name: hbase-region-ui
              containerPort: 60030
              protocol: TCP
          env:
            # Pod IP는 hbase.master.hostname / hbase.regionserver.hostname 주입에 사용
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: ACCEPT_EULA
              value: "true"
            # HBase가 외부 ZooKeeper(zoo1:2181)를 사용하도록 설정
            - name: HBASE_CONF_hbase_zookeeper_quorum
              value: "zoo1"
            - name: HBASE_CONF_hbase_zookeeper_property_clientPort
              value: "2181"
            # ZK 세션 타임아웃 5분 — AgentStatV2 63 region split 중 GC pause 대응
            # HBASE_CONF_hbase_* → hbase.* 프로퍼티 (hbase.zookeeper.session.timeout)
            - name: HBASE_CONF_hbase_zookeeper_session_timeout
              value: "300000"
          # 63+256 region 생성 시 CPU throttling 발생 → ZK 세션 타임아웃 (76s 무응답)
          # CPU limit 제거 + memory 증설로 region 생성 병목 해소
          resources:
            requests:
              memory: "3Gi"
              cpu: "1"
            limits:
              memory: "6Gi"
              cpu: "4"
          readinessProbe:
            tcpSocket:
              port: 60000
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 40
---
apiVersion: v1
kind: Service
metadata:
  name: pinpoint-hbase
  namespace: rental-commerce
  labels:
    app.kubernetes.io/name: pinpoint-hbase
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: rental-commerce
spec:
  type: ClusterIP
  ports:
    - name: hbase-master
      port: 60000
      targetPort: 60000
      protocol: TCP
    - name: hbase-master-ui
      port: 60010
      targetPort: 60010
      protocol: TCP
    - name: hbase-region
      port: 60020
      targetPort: 60020
      protocol: TCP
    - name: hbase-region-ui
      port: 60030
      targetPort: 60030
      protocol: TCP
  selector:
    app.kubernetes.io/name: pinpoint-hbase
