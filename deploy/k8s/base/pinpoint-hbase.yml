# =============================================================================
# Pinpoint HBase - Deployment + Service
# =============================================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pinpoint-hbase
  namespace: rental-commerce
  labels:
    app.kubernetes.io/name: pinpoint-hbase
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: rental-commerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pinpoint-hbase
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pinpoint-hbase
        app.kubernetes.io/component: monitoring
        app.kubernetes.io/part-of: rental-commerce
    spec:
      containers:
        - name: pinpoint-hbase
          image: pinpointdocker/pinpoint-hbase:3.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: hbase-master
              containerPort: 16010
              protocol: TCP
            - name: hbase-region
              containerPort: 16030
              protocol: TCP
          env:
            - name: ACCEPT_EULA
              value: "true"
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          readinessProbe:
            tcpSocket:
              port: 16010
            initialDelaySeconds: 120
            periodSeconds: 20
            timeoutSeconds: 15
            failureThreshold: 10
          livenessProbe:
            tcpSocket:
              port: 16010
            initialDelaySeconds: 180
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: pinpoint-hbase
  namespace: rental-commerce
  labels:
    app.kubernetes.io/name: pinpoint-hbase
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: rental-commerce
spec:
  type: ClusterIP
  ports:
    - name: hbase-master
      port: 16010
      targetPort: 16010
      protocol: TCP
    - name: hbase-region
      port: 16030
      targetPort: 16030
      protocol: TCP
  selector:
    app.kubernetes.io/name: pinpoint-hbase
