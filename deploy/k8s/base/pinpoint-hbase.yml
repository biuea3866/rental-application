# =============================================================================
# Pinpoint HBase - Deployment + Service
# =============================================================================
# pinpoint-hbase:3.0.0 이미지는 embedded ZooKeeper(2181)를 포함합니다.
# 외부 ZooKeeper 강제 설정 시 /hbase znode 미존재로 부트스트랩 실패.
# → embedded ZooKeeper 그대로 사용, 포트 2181 노출.
# =============================================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pinpoint-hbase
  namespace: rental-commerce
  labels:
    app.kubernetes.io/name: pinpoint-hbase
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: rental-commerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pinpoint-hbase
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pinpoint-hbase
        app.kubernetes.io/component: monitoring
        app.kubernetes.io/part-of: rental-commerce
    spec:
      containers:
        - name: pinpoint-hbase
          image: pinpointdocker/pinpoint-hbase:3.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: zookeeper
              containerPort: 2181
              protocol: TCP
            - name: hbase-master
              containerPort: 16000
              protocol: TCP
            - name: hbase-master-ui
              containerPort: 16010
              protocol: TCP
            - name: hbase-region
              containerPort: 16020
              protocol: TCP
            - name: hbase-region-ui
              containerPort: 16030
              protocol: TCP
          env:
            - name: ACCEPT_EULA
              value: "true"
          resources:
            requests:
              memory: "2Gi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
          readinessProbe:
            tcpSocket:
              port: 2181
            initialDelaySeconds: 120
            periodSeconds: 20
            timeoutSeconds: 15
            failureThreshold: 10
          livenessProbe:
            tcpSocket:
              port: 2181
            initialDelaySeconds: 180
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: pinpoint-hbase
  namespace: rental-commerce
  labels:
    app.kubernetes.io/name: pinpoint-hbase
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: rental-commerce
spec:
  type: ClusterIP
  ports:
    - name: zookeeper
      port: 2181
      targetPort: 2181
      protocol: TCP
    - name: hbase-master
      port: 16000
      targetPort: 16000
      protocol: TCP
    - name: hbase-master-ui
      port: 16010
      targetPort: 16010
      protocol: TCP
    - name: hbase-region
      port: 16020
      targetPort: 16020
      protocol: TCP
    - name: hbase-region-ui
      port: 16030
      targetPort: 16030
      protocol: TCP
  selector:
    app.kubernetes.io/name: pinpoint-hbase
