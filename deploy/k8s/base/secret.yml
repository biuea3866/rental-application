# =============================================================================
# Secret: rental-api-secret
# =============================================================================
# 주의: 이 파일은 플레이스홀더 템플릿입니다.
# 실제 배포 시 kubectl create secret 또는 sealed-secrets 사용을 권장합니다.
#
# 실제 시크릿 생성 예시:
#   kubectl create secret generic rental-api-secret \
#     --namespace=rental-commerce \
#     --from-literal=DB_URL='jdbc:mysql://db-host:3306/rental_commerce' \
#     --from-literal=DB_USERNAME='prod-user' \
#     --from-literal=DB_PASSWORD='<secure-password>' \
#     --from-literal=REDIS_HOST='redis-host' \
#     --from-literal=JWT_SECRET='<secure-jwt-secret>' \
#     --from-literal=MINIO_ACCESS_KEY='<minio-access>' \
#     --from-literal=MINIO_SECRET_KEY='<minio-secret>'
#
# 또는 SealedSecrets / External Secrets Operator 사용을 권장합니다.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: rental-api-secret
  namespace: rental-commerce
  labels:
    app.kubernetes.io/name: rental-api
    app.kubernetes.io/component: secret
    app.kubernetes.io/part-of: rental-commerce
type: Opaque
stringData:
  # =========================================================================
  # 아래 값들은 반드시 실제 배포 전에 교체해야 합니다.
  # 이 파일을 그대로 커밋하지 마십시오 (플레이스홀더 전용).
  # =========================================================================
  # DB_URL은 ConfigMap의 SPRING_DATASOURCE_URL로 대체됨 (로컬 minikube)
  DB_USERNAME: "rental"
  DB_PASSWORD: "rental"
  JWT_SECRET: "local-dev-jwt-secret-change-in-production"
  MINIO_ACCESS_KEY: "minioadmin"
  MINIO_SECRET_KEY: "minioadmin"
