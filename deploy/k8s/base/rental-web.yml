# =============================================================================
# rental-web (FE Next.js) - Deployment + Service
# =============================================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rental-web
  namespace: rental-commerce
  labels:
    app.kubernetes.io/name: rental-web
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: rental-commerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rental-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rental-web
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: rental-commerce
    spec:
      containers:
        - name: rental-web
          image: ghcr.io/biuea3866/rental-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: NEXT_PUBLIC_API_MODE
              value: "real"
            - name: NEXT_PUBLIC_API_URL
              value: "http://rental-api:80"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: rental-web
  namespace: rental-commerce
  labels:
    app.kubernetes.io/name: rental-web
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: rental-commerce
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
  selector:
    app.kubernetes.io/name: rental-web
