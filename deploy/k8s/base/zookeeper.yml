# =============================================================================
# Zookeeper - Deployment + Service (for Kafka)
# =============================================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zookeeper
  namespace: rental-commerce
  labels:
    app.kubernetes.io/name: zookeeper
    app.kubernetes.io/component: messaging
    app.kubernetes.io/part-of: rental-commerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: zookeeper
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zookeeper
        app.kubernetes.io/component: messaging
        app.kubernetes.io/part-of: rental-commerce
    spec:
      containers:
        - name: zookeeper
          image: confluentinc/cp-zookeeper:7.6.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: zookeeper
              containerPort: 2181
              protocol: TCP
          env:
            - name: ZOOKEEPER_CLIENT_PORT
              value: "2181"
            - name: ZOOKEEPER_TICK_TIME
              value: "2000"
            - name: ZOOKEEPER_SYNC_LIMIT
              value: "2"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "250m"
          readinessProbe:
            tcpSocket:
              port: 2181
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: 2181
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: zookeeper
  namespace: rental-commerce
  labels:
    app.kubernetes.io/name: zookeeper
    app.kubernetes.io/component: messaging
    app.kubernetes.io/part-of: rental-commerce
spec:
  type: ClusterIP
  ports:
    - name: zookeeper
      port: 2181
      targetPort: 2181
      protocol: TCP
  selector:
    app.kubernetes.io/name: zookeeper
