# =============================================================================
# ConfigMap: rental-api-config
# =============================================================================
# 애플리케이션의 비민감 설정값을 관리합니다.
# 민감한 값(DB 비밀번호, JWT 시크릿 등)은 Secret에서 관리합니다.
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: rental-api-config
  namespace: rental-commerce
  labels:
    app.kubernetes.io/name: rental-api
    app.kubernetes.io/component: config
    app.kubernetes.io/part-of: rental-commerce
data:
  # Spring Boot 프로파일
  SPRING_PROFILES_ACTIVE: "prod"
  # 서버 포트
  SERVER_PORT: "8080"
  # JVM 옵션 (컨테이너 메모리에 맞춰 조정)
  JAVA_OPTS: "-XX:MaxRAMPercentage=75.0 -XX:+UseG1GC"
  # 로깅 레벨
  LOGGING_LEVEL_ROOT: "INFO"
  LOGGING_LEVEL_DOODLIN: "DEBUG"
  # MinIO 엔드포인트 (클러스터 내부) — CRT-001: 같은 namespace이므로 단순 Service 이름 사용
  MINIO_ENDPOINT: "http://minio:9000"
  # Redis 포트
  SPRING_DATA_REDIS_PORT: "6379"
  # 소셜 로그인 (dev/placeholder — 실제 값은 Secret이 오버라이드)
  KAKAO_CLIENT_ID: "dev-placeholder"
  KAKAO_CLIENT_SECRET: "dev-placeholder"
  KAKAO_REDIRECT_URI: "http://localhost:3000/auth/kakao/callback"
  NAVER_CLIENT_ID: "dev-placeholder"
  NAVER_CLIENT_SECRET: "dev-placeholder"
  NAVER_REDIRECT_URI: "http://localhost:3000/auth/naver/callback"
  # MongoDB + Kafka (클러스터 내부 Service DNS)
  SPRING_DATA_MONGODB_URI: "mongodb://mongodb:27017/rental_commerce"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
