# =============================================================================
# Kustomize Base: rental-commerce (base wrapper)
# =============================================================================
# kustomize v5 requires overlays to reference a non-ancestor directory.
# This base/ directory wraps the root manifests so overlays can reference
# deploy/k8s/base/ safely without triggering cycle detection.
# =============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: rental-commerce

# commonLabels는 Deployment/Service spec.selector까지 변경하여
# - Deployment selector 불변 오류 (한 번 만들어지면 수정 불가)
# - Service selector ↔ Pod label 불일치 (엔드포인트 비어있음)
# 두 가지 치명적 버그 유발. labels + includeSelectors: false로 교체.
labels:
  - pairs:
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false

resources:
  - namespace.yml
  - configmap.yml
  - secret.yml
  - deployment.yml
  - service.yml
  - ingress.yml
  - hpa.yml
  - pinpoint-zookeeper.yml
  - pinpoint-hbase.yml
  - pinpoint-collector.yml
  - pinpoint-web.yml
