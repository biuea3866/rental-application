spring:
  main:
    allow-bean-definition-overriding: true
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:9092

# SocialLoginProperties — E2E 범위 미사용, ConfigurationProperties 바인딩 필수
social:
  kakao:
    client-id: test-kakao-client-id
    client-secret: test-kakao-client-secret
    redirect-uri: http://localhost:3000/auth/kakao/callback
  naver:
    client-id: test-naver-client-id
    client-secret: test-naver-client-secret
    redirect-uri: http://localhost:3000/auth/naver/callback

# MinioProperties — E2E 범위 미사용, ConfigurationProperties 바인딩 필수
minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  buckets:
    products: products
    inspections: inspections
    documents: documents
    chat: chat

# JwtProperties — 기본값 있지만 명시 설정
jwt:
  access-token-expiry: PT30M
  refresh-token-expiry: P14D
  issuer: rental-commerce-e2e-test
